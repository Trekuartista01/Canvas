name: canvas-app

services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in Postgres 16 image with the
    # pgvector extension binary preinstalled (Phase 6: semantic + visual
    # search) — `CREATE EXTENSION vector` still has to run per-database,
    # done by the embeddings migration itself, not here.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Was minio/minio until MinIO pulled its
  # public images (Docker Hub now 404s) — RustFS is a drop-in on the same
  # ports. Unlike MinIO it implements PutBucketCors, so storage.ts's
  # ensureBucketExists() applies the browser-upload CORS rule (WEB_URL) for
  # real; no server-level CORS env var needed. Console: localhost:9001.
  s3:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: canvas
      RUSTFS_SECRET_KEY: canvas12345
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  s3-data:
