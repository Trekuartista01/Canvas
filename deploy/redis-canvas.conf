# Canvas production Redis settings (see DEPLOYMENT.md, step 4).
# Appended to /etc/redis/redis.conf (later lines win over the defaults above
# them) — DEPLOYMENT.md step 4 does it with one command that also fills in the
# password — then `sudo systemctl restart redis-server`.

# Only this VM can talk to Redis — never the internet.
bind 127.0.0.1 -::1
protected-mode yes

# Replace with the output of `openssl rand -hex 24` (hex: no characters that
# need escaping in REDIS_URL). The same value goes in .env as
#   REDIS_URL=redis://:<that password>@127.0.0.1:6379
requirepass CHANGE_ME_TO_A_LONG_RANDOM_HEX_STRING

# BullMQ keeps its queues here; never evict them to make room.
maxmemory-policy noeviction

# Survive a reboot without losing queued jobs (append-only file, fsync each second).
appendonly yes
appendfsync everysec
